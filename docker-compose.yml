services:
  web:
    image: node:22-alpine
    working_dir: /usr/src/app
    env_file:
      - .env
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: 'false'
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-fitnessdata}
      API_URL: http://localhost:${WEB_PORT:-3000}/api/v1
      BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3000}/api/v1
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3000}/api/v1
    volumes:
      - ./apps/web/.next/standalone:/usr/src/app
      - ./apps/web/.next/static:/usr/src/app/.next/static
      - ./apps/web/.next/static:/usr/src/app/apps/web/.next/static
      - ./apps/web/public:/usr/src/app/public
      - ./apps/web/public:/usr/src/app/apps/web/public
    command: node apps/web/server.js
    restart: unless-stopped
    networks:
      - fitness_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fitnessdata}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fitness_net
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  fitness_net:
    driver: bridge

volumes:
  postgres_data:
