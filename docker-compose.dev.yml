services:
  web:
    image: oven/bun:1.3.12
    working_dir: /usr/src/app
    env_file:
      - .env
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      SWAGGER_ENABLED: 'true'
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-fitnessdata}
      BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3000}/api/v1
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3000}/api/v1
    volumes:
      - .:/usr/src/app
      - web_node_modules:/usr/src/app/node_modules
    command: sh -c "bun install --frozen-lockfile && bun run --filter web dev"
    networks:
      - fitness_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fitnessdata}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fitness_net
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  fitness_net:
    driver: bridge

volumes:
  web_node_modules:
  postgres_data:
